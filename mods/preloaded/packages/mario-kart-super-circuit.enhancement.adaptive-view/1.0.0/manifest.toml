format_version = 1
id = "mario-kart-super-circuit.enhancement.adaptive-view"
version = "1.0.0"
name = "Mario Kart: Super Circuit Adaptive Widescreen"
author = "mstan"
description = "Expands the race view using Mario Kart's live road and scenery backgrounds while preserving native presentation for menus and transitions."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "mario-kart-super-circuit-us"
rom_sha1 = "9d327c030c3e2d9007990518594f70c3340ac56f"

[[feature]]
id = "adaptive-view"
name = "Adaptive Widescreen"
description = "Expand single-player race scenes beyond native 3:2. Choose Fit to screen to follow the window or fullscreen display, or choose a fixed 16:9 view. Menus retain native framing."
group = "Display"
default_enabled = true

[[option]]
feature = "adaptive-view"
id = "view"
label = "Race view"
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit to screen"

[[option.choice]]
value = "16:9"
label = "16:9"

[[plugin]]
feature = "adaptive-view"
id = "mario-kart-super-circuit.adaptive-view"
